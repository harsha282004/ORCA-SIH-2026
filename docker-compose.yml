services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: orca-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orca}
      POSTGRES_USER: ${POSTGRES_USER:-orca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - orca_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orca} -d ${POSTGRES_DB:-orca}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: orca-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orca-backend
    environment:
      ORCA_MODE: ${ORCA_MODE:-demo}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      POSTGRES_DB: ${POSTGRES_DB:-orca}
      POSTGRES_USER: ${POSTGRES_USER:-orca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DEMO_BBOX_MIN_LAT: ${DEMO_BBOX_MIN_LAT:-12.70}
      DEMO_BBOX_MIN_LON: ${DEMO_BBOX_MIN_LON:-73.50}
      DEMO_BBOX_MAX_LAT: ${DEMO_BBOX_MAX_LAT:-13.45}
      DEMO_BBOX_MAX_LON: ${DEMO_BBOX_MAX_LON:-75.05}
      OPEN_METEO_WEATHER_BASE_URL: ${OPEN_METEO_WEATHER_BASE_URL:-https://api.open-meteo.com/v1/forecast}
      OPEN_METEO_MARINE_BASE_URL: ${OPEN_METEO_MARINE_BASE_URL:-https://marine-api.open-meteo.com/v1/marine}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-6.0}
      WEATHER_MAX_STALENESS_MINUTES: ${WEATHER_MAX_STALENESS_MINUTES:-30}
      MARINE_MAX_STALENESS_MINUTES: ${MARINE_MAX_STALENESS_MINUTES:-30}
    ports:
      - "8000:8000"
    volumes:
      # Phase 1 (Marine Data Foundation): the repo's top-level data/raw and
      # data/processed directories (architecture.md §42, `Settings
      # .data_raw_dir`'s own "relative to cwd" convention) were never
      # actually reachable from inside the container before this — the
      # backend image's build context is ./backend only. Mounted here so
      # acquired datasets (GEBCO, INCOIS) persist across rebuilds and are
      # readable by both the acquisition scripts and the running API from
      # the SAME physical files the host repository tracks.
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orca-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  orca_postgres_data:
